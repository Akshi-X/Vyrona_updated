[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "surya-senthilkumar-ZS0638",email = "surya.senthilkumar@zucisystems.com"},
    {name = "Jothika Rajendran",email = "jothika.rajendran@zucisystems.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.118.0,<0.119.0)",
    "sqlalchemy (>=2.0.43,<3.0.0)",
    "pydantic[email] (>=2.11.9,<3.0.0)",
    "pydantic-settings (>=2.0.0,<3.0.0)",
    "uvicorn (>=0.37.0,<0.38.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "python-jose[cryptography] (>=3.3.0,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "bcrypt (>=4.0.1,<4.1.0)",
    "python-multipart (>=0.0.6,<1.0.0)",
    "jinja2 (>=3.1.0,<4.0.0)",
    "sendgrid (>=6.10.0,<7.0.0)",
    "alembic (>=1.13.0,<2.0.0)",
    "country-converter (>=1.0.0,<2.0.0)",
    "redis (>=5.0.0,<6.0.0)",
    "websockets (>=12.0,<16.0)",
    "orjson (>=3.11.4,<4.0.0)",
    "gunicorn (>=23.0.0,<24.0.0)",
    "requests (>=2.31.0,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "openpyxl (>=3.1.0,<4.0.0)",
    "azure-identity (>=1.16.0,<2.0.0)",
    "azure-keyvault-secrets (>=4.8.0,<5.0.0)",
    "azure-storage-blob (>=12.0.0,<13.0.0)",
    "twilio (>=9.10.3,<10.0.0)",
]
[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
coverage = ">=7.6"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.0.0"
pytest-mock = "^3.15.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.0,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)"
]

[tool.pytest.ini_options]
python_paths = ["app"]
testpaths = ["tests"]

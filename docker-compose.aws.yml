services:
  redis:
    image: redis:7-alpine
    container_name: mgscale-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mgscale-network

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: mgscale-azurite
    restart: always
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite_data:/data
    healthcheck:
      test: ["CMD-SHELL", "node -e 'const http = require(\"http\"); const req = http.get(\"http://127.0.0.1:10000/\", res => { process.exit([200,400,404].includes(res.statusCode) ? 0 : 1); }); req.on(\"error\", () => process.exit(1));'"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - mgscale-network

  eventhub-emulator:
    image: mcr.microsoft.com/azure-messaging/eventhubs-emulator:latest
    container_name: mgscale-eventhub-emulator
    restart: always
    ports:
      - "5672:5672"
      - "9092:9092"
    environment:
      BLOB_SERVER: azurite
      METADATA_SERVER: azurite
      ACCEPT_EULA: "Y"
    depends_on:
      azurite:
        condition: service_healthy
    volumes:
      - ./eventhub-config/config.json:/Eventhubs_Emulator/ConfigFiles/Config.json
    networks:
      - mgscale-network

  smtp4dev:
    image: rnwood/smtp4dev:latest
    container_name: mgscale-smtp4dev
    restart: always
    ports:
      - "5000:80"
      - "2525:25"
      - "110:110"
    networks:
      - mgscale-network

  telemetry-service:
    build:
      context: ./telemetry-service
      dockerfile: Dockerfile
    container_name: mgscale-telemetry
    restart: always
    ports:
      - "7071:80"
    depends_on:
      azurite:
        condition: service_healthy
      redis:
        condition: service_healthy
      eventhub-emulator:
        condition: service_started
    environment:
      - AzureWebJobsStorage=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
      - FUNCTIONS_WORKER_RUNTIME=python
      - DB_HOST=vyrona-db.cxc6ciki4v61.ap-south-2.rds.amazonaws.com
      - DB_PORT=5432
      - DB_NAME=mygrape
      - DB_USER=postgres
      - DB_PASSWORD=Steezy#123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - ALERT_API_BASE_URL=http://backend:8000
      - INTERNAL_API_KEY=CHANGE_ME_TO_A_SECURE_RANDOM_STRING
      - EVENT_HUB_CONNECTION_STRING=Endpoint=sb://eventhub-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
      - EVENT_HUB_NAME=telemetry-events
    networks:
      - mgscale-network

  iot-ingestion-service:
    build:
      context: ./tive-ingestion-function
      dockerfile: Dockerfile
    container_name: mgscale-iot-ingestion
    restart: always
    ports:
      - "7072:80"
    depends_on:
      azurite:
        condition: service_healthy
      eventhub-emulator:
        condition: service_started
    environment:
      - AzureWebJobsStorage=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
      - FUNCTIONS_WORKER_RUNTIME=python
      - TIVE_WEBHOOK_KEY=dev-test-key
      - TIVE_WEBHOOK_SECRET=
      - ALLOW_UNAUTHENTICATED_FOR_DEBUG=true
      - EVENTHUB_CONNECTION=Endpoint=sb://eventhub-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
      - EVENTHUB_NAME=telemetry-events
    networks:
      - mgscale-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mgscale-backend-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=vyrona-db.cxc6ciki4v61.ap-south-2.rds.amazonaws.com
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=Steezy#123
      - DB_NAME=mygrape
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_SSL=false
      - SECRET_KEY=vyrona-production-secret-key-3:1-scale
      - ADMIN_EMAIL=admin@example.com
      - ADMIN_DEFAULT_PASSWORD=your-admin-default-password
      - MYGRAPE_ADMIN_EMAIL=mygrapeadmin@example.com
      - MYGRAPE_ADMIN_PASSWORD=password123
      - FRONTEND_URL=http://16.113.114.79
      - BACKEND_URL=http://16.113.114.79:8000
      - ALLOWED_ORIGINS=http://16.113.114.79,http://16.113.114.79:8000,http://localhost:5173
      - IOT_CLIENT_ID=test
      - IOT_CLIENT_SECRET=90db32df-07fc-44fd-9376-013245eaadd4
      - IOT_ACCOUNT_ID=9104
      - ENVIRONMENT=production
      - DEBUG=false
      - SMTP_SERVER=smtp4dev
      - SMTP_PORT=25
      - SMTP_USERNAME=
      - SMTP_PASSWORD=
      # To switch back to Amazon SES:
      # - SMTP_SERVER=email-smtp.ap-south-1.amazonaws.com
      # - SMTP_PORT=587
      # - SMTP_USERNAME=your-smtp-username
      # - SMTP_PASSWORD=your-smtp-password
      - SENDER_EMAIL=steezyadopted@gmail.com
      - FIXED_OTP_MODE=false
      - FIXED_OTP_CODE=123456
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      - AZURE_STORAGE_CONNECTION_STRING=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
      - AZURE_STORAGE_BLOB_CONTAINER=ivf-media
      - AWS_REGION=ap-south-2
      - AWS_SNS_TOPIC_ARN=arn:aws:sns:ap-south-2:372951852039:vyrona-alerts
      - AWS_SNS_PHONE_NUMBER=
      - AWS_SNS_ENABLED=true
    depends_on:
      redis:
        condition: service_healthy
      azurite:
        condition: service_healthy
    networks:
      - mgscale-network

volumes:
  azurite_data:

networks:
  mgscale-network:
    driver: bridge

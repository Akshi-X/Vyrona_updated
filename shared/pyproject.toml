[project]
name = "mgscale-shared"
version = "0.1.0"
description = "Shared SQLAlchemy models for mgscale dashboard-service monorepo"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.0,<3.0.0",
    "psycopg2-binary>=2.9.0,<3.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

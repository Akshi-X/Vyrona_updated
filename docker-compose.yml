version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: mgscale-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mygrape}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mygrape"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mgscale-network

  redis:
    image: redis:7-alpine
    container_name: mgscale-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mgscale-network

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: mgscale-azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite_data:/data
    healthcheck:
      test: ["CMD-SHELL", "node -e 'const http = require(\"http\"); const req = http.get(\"http://127.0.0.1:10000/\", res => { process.exit([200,400,404].includes(res.statusCode) ? 0 : 1); }); req.on(\"error\", () => process.exit(1));'"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - mgscale-network

  eventhub-emulator:
    image: mcr.microsoft.com/azure-messaging/eventhubs-emulator:latest
    container_name: mgscale-eventhub-emulator
    ports:
      - "5672:5672"
      - "9092:9092"
    environment:
      BLOB_SERVER: azurite
      METADATA_SERVER: azurite
      ACCEPT_EULA: "Y"
    depends_on:
      azurite:
        condition: service_healthy
    volumes:
      - ./eventhub-config/config.json:/Eventhubs_Emulator/ConfigFiles/Config.json
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5672 || exit 0"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - mgscale-network

  smtp4dev:
    image: rnwood/smtp4dev:latest
    container_name: mgscale-smtp4dev
    ports:
      - "5000:80"
      - "2525:25"
      - "110:110"
    networks:
      - mgscale-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mgscale-backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      smtp4dev:
        condition: service_started
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-mygrape}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_SSL=${REDIS_SSL:-false}
      - SMTP_SERVER=smtp4dev
      - SMTP_PORT=25
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - FIXED_OTP_MODE=true
      - FIXED_OTP_CODE=123456
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - BACKEND_URL=${BACKEND_URL:-http://localhost:8000}
      - ALLOWED_ORIGINS=*
      - SECRET_KEY=${SECRET_KEY}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD}
      - MYGRAPE_ADMIN_EMAIL=${MYGRAPE_ADMIN_EMAIL}
      - MYGRAPE_ADMIN_PASSWORD=${MYGRAPE_ADMIN_PASSWORD}
      - IOT_CLIENT_ID=${IOT_CLIENT_ID}
      - IOT_CLIENT_SECRET=${IOT_CLIENT_SECRET}
      - IOT_ACCOUNT_ID=${IOT_ACCOUNT_ID}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - ENVIRONMENT=development
      - DEBUG=true
    volumes:
      - ./backend/app:/app/app
      - ./backend/static:/app/static
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    networks:
      - mgscale-network

  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
      target: dev
    container_name: mgscale-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
      - VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY}
    volumes:
      - ./FrontEnd:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - mgscale-network

  telemetry-service:
    build:
      context: ./telemetry-service
      dockerfile: Dockerfile
    container_name: mgscale-telemetry
    ports:
      - "7071:80"
    depends_on:
      azurite:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
      eventhub-emulator:
        condition: service_started
    environment:
      - AzureWebJobsStorage=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
      - FUNCTIONS_WORKER_RUNTIME=python
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-mygrape}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - ALERT_API_BASE_URL=http://backend:8000
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - EVENT_HUB_CONNECTION_STRING=Endpoint=sb://eventhub-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
      - EVENT_HUB_NAME=telemetry-events
    networks:
      - mgscale-network

  iot-ingestion-service:
    build:
      context: ./tive-ingestion-function
      dockerfile: Dockerfile
    container_name: mgscale-iot-ingestion
    ports:
      - "7072:80"
    depends_on:
      azurite:
        condition: service_healthy
      backend:
        condition: service_started
      eventhub-emulator:
        condition: service_started
    environment:
      - AzureWebJobsStorage=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
      - FUNCTIONS_WORKER_RUNTIME=python
      - TIVE_WEBHOOK_KEY=${TIVE_WEBHOOK_KEY:-dev-test-key}
      - TIVE_WEBHOOK_SECRET=${TIVE_WEBHOOK_SECRET:-}
      - ALLOW_UNAUTHENTICATED_FOR_DEBUG=true
      - EVENTHUB_CONNECTION=Endpoint=sb://eventhub-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
      - EVENTHUB_NAME=telemetry-events
    networks:
      - mgscale-network

volumes:
  postgres_data:
  azurite_data:

networks:
  mgscale-network:
    driver: bridge
name: Build, Push & Deploy Docker Image - mgscale-backend-dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # REQUIRED for azure/login

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Azure Login (OIDC)
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E827A6FF6CDB465783FB263473BFB596 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4A612E608EAF473F8845FCACCC6A05FE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E047935FC2B142BEAFF7D9170EC2DE11 }}

      # 3️⃣ Login to ACR (hardcoded as requested)
      - name: Login to ACR
        run: |
          docker login myscaledev.azurecr.io \
            -u myscaledev \
            -p 8deM4F5yZBqNh7CY37IkxYqaG6VbuoKz1xJiw4KCgPqZrUJFGUVyJQQJ99CBAC5RqLJEqg7NAAACAZCRdHtK

      # 4️⃣ Build Docker image using backend Dockerfile
      - name: Build Docker Image
        run: |
          docker build \
            -t myscaledev.azurecr.io/mgscale-backend:${{ github.run_number }} \
            ./backend

      # 5️⃣ Push image to ACR
      - name: Push Docker Image
        run: |
          docker push myscaledev.azurecr.io/mgscale-backend:${{ github.run_number }}

      # 6️⃣ Deploy image to Azure App Service (Container)
      - name: Deploy to Azure Web App (Container)
        uses: azure/webapps-deploy@v3
        with:
          app-name: mgscale-backend-service-dev
          images: myscaledev.azurecr.io/mgscale-backend:${{ github.run_number }}

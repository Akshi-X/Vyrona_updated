name: Build, Push & Deploy Docker Image - mgscale-backend-dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Azure Login (Service Principal using AZURE_CREDENTIALS)
      - name: Azure Login
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3️⃣ Verify Web App access (RBAC check)
      - name: Verify Web App
        run: |
          az webapp show \
            --name mgscale-backend-service-dev \
            --resource-group Mgscale

      # 4️⃣ Login to ACR
      - name: Login to ACR
        run: |
          docker login myscaledev.azurecr.io \
            -u myscaledev \
            -p ${{ secrets.ACR_ADMIN_PASSWORD }}

      # 5️⃣ Build Docker image
      - name: Build Docker Image
        run: |
          docker build \
            -t myscaledev.azurecr.io/mgscale-backend:${{ github.run_number }} \
            ./backend

      # 6️⃣ Push Docker image
      - name: Push Docker Image
        run: |
          docker push myscaledev.azurecr.io/mgscale-backend:${{ github.run_number }}

      # 7️⃣ Deploy image to Azure Web App (Container)
      - name: Deploy to Azure Web App (Container)
        uses: azure/webapps-deploy@v3
        with:
          app-name: mgscale-backend-service-dev
          images: myscaledev.azurecr.io/mgscale-backend:${{ github.run_number }}



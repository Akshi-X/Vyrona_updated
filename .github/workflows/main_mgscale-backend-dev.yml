name: Build, Push & Deploy Docker Image - mgscale-backend-dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read   # ✅ no id-token needed for client-secret auth

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Azure Login (Service Principal with Client Secret)
      - name: Azure Login
        uses: azure/login@v2
        with:
          auth-type: service-principal   # 🔴 THIS WAS MISSING
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      # 3️⃣ Set subscription
      - name: Set Azure subscription
        run: az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 4️⃣ Verify Web App (RBAC check)
      - name: Verify Web App
        run: |
          az webapp show \
            --name mgscale-backend-service-dev \
            --resource-group Mgscale

      # 5️⃣ Login to ACR
      - name: Login to ACR
        run: |
          docker login myscaledev.azurecr.io \
            -u myscaledev \
            -p ${{ secrets.ACR_ADMIN_PASSWORD }}

      # 6️⃣ Build Docker image
      - name: Build Docker Image
        run: |
          docker build \
            -t myscaledev.azurecr.io/mgscale-backend:${{ github.run_number }} \
            ./backend

      # 7️⃣ Push Docker image
      - name: Push Docker Image
        run: |
          docker push myscaledev.azurecr.io/mgscale-backend:${{ github.run_number }}

      # 8️⃣ Deploy to Azure Web App
      - name: Deploy to Azure Web App (Container)
        uses: azure/webapps-deploy@v3
        with:
          app-name: mgscale-backend-service-dev
          images: myscaledev.azurecr.io/mgscale-backend:${{ github.run_number }}

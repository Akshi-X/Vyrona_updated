name: Reusable Azure Function Deployment

on:
  workflow_call:
    inputs:
      function_app_name:
        required: true
        type: string
      function_app_path:
        required: true
        type: string
      python_version:
        required: false
        type: string
        default: "3.11"
    secrets:
      AZURE_CREDENTIALS:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ inputs.function_app_name }}
          package: ${{ inputs.function_app_path }}
          remote-build: true

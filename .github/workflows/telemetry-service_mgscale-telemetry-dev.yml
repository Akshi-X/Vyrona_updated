name: Deploy Azure Function (Flex, nozip)

on:
  push:
    branches:
      - develop
    paths:
      - "telemetry-service/**"
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/reusable-azure-function-python.yml
    with:
      function_app_name: mgscale-telemetry-dev
      function_app_path: telemetry-service
      python_version: "3.11"
    secrets:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}


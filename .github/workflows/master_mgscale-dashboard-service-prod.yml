name: Build and Deploy Frontend (Vite) - mgscale-dashboard-service-prod

on:
  push:
    branches:
      - master
    paths:
      - "FrontEnd/**"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: FrontEnd/package-lock.json

      # 3️⃣ Install dependencies
      - name: Install dependencies
        working-directory: FrontEnd
        run: npm ci

      # 4️⃣ Validate PROD API URL secret
      - name: Validate PROD API URL secret
        working-directory: FrontEnd
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL_PROD }}
        run: |
          if [ -z "${{ secrets.VITE_API_BASE_URL_PROD }}" ]; then
            echo "::error::VITE_API_BASE_URL_PROD is missing! Please add it to GitHub Secrets."
            exit 1
          else
            echo "Correct value"
          fi

      # 5️⃣ Build frontend (inject Vite env vars)
      - name: Build frontend
        working-directory: FrontEnd
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL_PROD }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_MAP_ID: ${{ secrets.VITE_GOOGLE_MAP_ID }}
        run: |
          npm run build
          cp web.config dist/

      # 6️⃣ Azure Login using SAME Service Principal as Backend
      - name: Azure Login
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 7️⃣ Deploy dist folder to Azure Web App
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: mgscale-dashboard-service-prod
          package: FrontEnd/dist

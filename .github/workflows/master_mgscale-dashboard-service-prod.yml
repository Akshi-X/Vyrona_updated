name: Build and Deploy Frontend (Vite) - mgscale-dashboard-service-prod

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: FrontEnd/package-lock.json

      # 3️⃣ Install dependencies
      - name: Install dependencies
        working-directory: FrontEnd
        run: npm ci

      # 4️⃣ Validate PROD API URL secret
      - name: Validate PROD API URL secret
        working-directory: FrontEnd
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL_PROD }}
        run: |
          echo "Checking secret..."
          if [ "$VITE_API_BASE_URL" = "https://mgscale-backend-service-dev-h8f7bhcbagh5gyez.westeurope-01.azurewebsites.net" ]; then
            echo "Correct value"
          else
            echo "Wrong value"
          fi


      # 4️⃣ Build frontend (inject Vite env vars)
      - name: Build frontend
        working-directory: FrontEnd
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL_PROD }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          npm run build
          cp web.config dist/

      # 5️⃣ Upload dist artifact
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: FrontEnd/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read

    steps:
      # 6️⃣ Download dist artifact
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      # 7️⃣ Azure Login using SAME Service Principal as Backend
      - name: Azure Login
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 8️⃣ Deploy dist folder to Azure Web App
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: mgscale-dashboard-service-prod
          package: dist



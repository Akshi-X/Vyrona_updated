name: Build and Deploy Frontend (Vite) - mgscale-dashboard-service-prod

on:
  push:
    branches:
      - master
    paths:
      - "FrontEnd/**"
  workflow_dispatch:

jobs:
  build-and-deploy:
    uses: ./.github/workflows/reusable-azure-webapp-node.yml
    with:
      app_name: mgscale-dashboard-service-prod
      frontend_path: FrontEnd
      node_version: '22.x'
    secrets:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL_PROD }}
      VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
      VITE_GOOGLE_MAP_ID: ${{ secrets.VITE_GOOGLE_MAP_ID }}


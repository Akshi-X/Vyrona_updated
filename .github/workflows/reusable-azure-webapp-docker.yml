name: Reusable Docker Web App Deployment

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      acr_login_server:
        required: true
        type: string
      acr_username:
        required: true
        type: string
      image_name:
        required: true
        type: string
      context_path:
        required: false
        type: string
        default: "."
    secrets:
      AZURE_CREDENTIALS:
        required: true
      ACR_PASSWORD:
        required: true

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ inputs.acr_login_server }} \
            -u ${{ inputs.acr_username }} \
            --password-stdin

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ inputs.acr_login_server }}/${{ inputs.image_name }}:${{ github.run_number }} \
            ${{ inputs.context_path }}

      - name: Push Docker Image
        run: |
          docker push ${{ inputs.acr_login_server }}/${{ inputs.image_name }}:${{ github.run_number }}

      - name: Deploy to Azure Web App (Container)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ inputs.app_name }}
          images: ${{ inputs.acr_login_server }}/${{ inputs.image_name }}:${{ github.run_number }}
